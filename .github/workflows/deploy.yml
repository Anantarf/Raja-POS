name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Starting deployment on cPanel..."
            DEPLOY_ROOT="${{ secrets.TARGET_DIR }}"
            PUBLIC_DIR="$DEPLOY_ROOT"
            cd "$DEPLOY_ROOT"
            if [ -f artisan ]; then
              APP_DIR="$(pwd)"
            elif [ -f raja-pos/artisan ]; then
              APP_DIR="$(pwd)/raja-pos"
            elif [ -f ../raja-pos/artisan ]; then
              APP_DIR="$(pwd)/../raja-pos"
            elif [ -f ../../raja-pos/artisan ]; then
              APP_DIR="$(pwd)/../../raja-pos"
            else
              echo "Laravel app not found. Current directory: $(pwd)"
              ls -la
              exit 1
            fi
            cd "$APP_DIR"
            
            echo "Fetching and forcing hard reset to origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "Installing/updating Composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            echo "Running database migrations..."
            php artisan migrate --force
            
            echo "Clearing all caches and compiled views..."
            php artisan optimize:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan event:clear

            echo "Building frontend assets..."
            if command -v npm &> /dev/null; then
              npm ci --no-audit --no-fund
              npm run build
            fi

            echo "Syncing frontend build to public web root..."
            if [ -d "$PUBLIC_DIR" ]; then
              mkdir -p "$PUBLIC_DIR/build"
              cp -R public/build/. "$PUBLIC_DIR/build/"
              touch "$PUBLIC_DIR/index.php"
            else
              echo "Public web root not found: $PUBLIC_DIR"
              exit 1
            fi

            echo "Touch public/index.php for OPcache refresh..."
            touch public/index.php
            
            echo "Caching configurations..."
            php artisan config:cache
            php artisan route:cache
            
            echo "Verifying storage link..."
            php artisan storage:link || true
            
            echo "Deployment finished successfully!"
