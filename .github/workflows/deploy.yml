name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          script_stop: true
          script: |
            set -euo pipefail
            echo "Starting deployment on cPanel..."
            DEPLOY_ROOT="${{ secrets.TARGET_DIR }}"
            PUBLIC_DIR="$DEPLOY_ROOT"
            cd "$DEPLOY_ROOT"
            if [ -f artisan ]; then
              APP_DIR="$(pwd)"
            elif [ -f raja-pos/artisan ]; then
              APP_DIR="$(pwd)/raja-pos"
            elif [ -f ../raja-pos/artisan ]; then
              APP_DIR="$(pwd)/../raja-pos"
            elif [ -f ../../raja-pos/artisan ]; then
              APP_DIR="$(pwd)/../../raja-pos"
            else
              echo "Laravel app not found. Current directory: $(pwd)"
              ls -la
              exit 1
            fi
            cd "$APP_DIR"
            echo "Laravel app directory: $(pwd)"
            
            echo "Preparing Git repository..."
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/Anantarf/Raja-POS.git
            elif ! git remote get-url origin > /dev/null 2>&1; then
              git remote add origin https://github.com/Anantarf/Raja-POS.git
            fi

            echo "Fetching and forcing hard reset to origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            
            echo "Installing/updating Composer dependencies..."
            if command -v composer > /dev/null 2>&1; then
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            elif [ -f vendor/autoload.php ]; then
              echo "Composer not found; using existing vendor directory."
            else
              echo "Composer not found and vendor/autoload.php is missing."
              exit 1
            fi
            
            echo "Running database migrations..."
            php artisan migrate --force
            
            echo "Clearing all caches and compiled views..."
            php artisan optimize:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan event:clear

            echo "Using committed frontend assets..."
            if [ ! -f public/build/manifest.json ]; then
              echo "public/build/manifest.json is missing. Run npm run build locally and commit public/build."
              exit 1
            fi
            echo "Committed manifest:"
            cat public/build/manifest.json

            echo "Syncing frontend build to public web root..."
            if [ -d "$PUBLIC_DIR" ]; then
              mkdir -p "$PUBLIC_DIR/build"
              cp -R public/build/. "$PUBLIC_DIR/build/"
              echo "Public manifest after sync:"
              cat "$PUBLIC_DIR/build/manifest.json"
              grep -q '"resources/css/app.css"' "$PUBLIC_DIR/build/manifest.json"
              grep -q '"file": "assets/app-' "$PUBLIC_DIR/build/manifest.json"
              touch "$PUBLIC_DIR/index.php"
            else
              echo "Public web root not found: $PUBLIC_DIR"
              exit 1
            fi

            echo "Touch public/index.php for OPcache refresh..."
            touch public/index.php
            
            echo "Caching configurations..."
            php artisan config:cache
            php artisan route:cache
            
            echo "Verifying storage link..."
            php artisan storage:link || true
            
            echo "Deployment finished successfully!"
